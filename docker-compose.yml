# Docker Compose SOLO con el backend (para probar la imagen de producción en
# local). La base de datos NO va acá: en producción es Neon y se configura con
# la variable DATABASE_URL.
#
# Uso:
#   cp .env.production.example .env   # y completá DATABASE_URL (Neon) + secretos
#   docker compose up --build
#   curl http://localhost:8000/health/

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/').status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
